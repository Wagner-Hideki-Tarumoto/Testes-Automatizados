name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ✅ NOVO: Verificação e Formatação com Ruff
  lint:
    name: Ruff — Verificação e Formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Configurar PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Instalar dependências
        run: uv sync --all-extras
      - name: Ruff — Verificação
        run: uv run ruff check .
      - name: Ruff — Formatação
        run: uv run ruff format --check .

  # ✅ Seus testes originais continuam IGUAL
  test-unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: pytest tests/test_unit.py -v -x

  test-integration:
    needs: test-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: pytest tests/test_integration.py -v -x

  test-e2e:
    needs: test-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: xvfb-run pytest tests/test_ui.py -v -x